<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ito ジェネレーター</title><style>:root{--main:#FFC5AA;--pink:#FF9D9D;--cream:#EEF8CD;--mint:#BBF1D2;--text:#4b4542}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--text);font-family:"しろくまフォント","Shirokuma Font","Segoe UI",sans-serif}.title,h1,h2,h3,button,.player{font-family:"しろくまフォント","Shirokuma Font","Palisade","Segoe UI",sans-serif}.wrap{width:min(680px,92%);margin:auto;padding:28px 0 48px}h1{text-align:center;font-size:clamp(2.8rem,10vw,4.5rem);margin:0 0 8px}.sub{text-align:center;opacity:.7;margin:0 0 24px}.card{background:#fffdfb;border:3px solid var(--main);border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:0 7px 0 rgba(255,157,157,.35)}.topic-card{background:var(--main);border-color:var(--pink)}label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;padding:13px 15px;border:2px solid var(--mint);border-radius:14px;font-size:1.05rem}button{border:0;border-radius:16px;padding:13px 18px;font-size:1rem;font-weight:700;cursor:pointer;color:var(--text);background:var(--pink);box-shadow:0 4px 0 rgba(75,69,66,.12);width:100%;margin-top:12px}button.secondary{background:var(--mint)}button.cream{background:var(--cream)}.topic{text-align:center;font-size:clamp(1.5rem,6vw,2.3rem);font-weight:700;padding:16px 8px}.player{text-align:center;font-size:1.4rem}.number-box{background:var(--cream);border:3px dashed var(--mint);border-radius:20px;text-align:center;padding:24px 12px;margin:16px 0}.number{font-size:clamp(4rem,18vw,7rem);line-height:1;font-weight:800}.hint{text-align:center;opacity:.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}.result{background:var(--mint);border-radius:14px;padding:12px 8px;text-align:center;font-weight:700}.result b{display:block;font-size:1.8rem}.hidden{display:none}@media(max-width:480px){.card{padding:18px;border-radius:20px}}</style></head><body><main class="wrap"><h1>ito</h1><p class="sub">みんなで数字を当てるゲーム</p><section id="setup" class="card"><label for="count">参加人数</label><input id="count" type="number" min="2" max="100" value="4"><button id="start">ゲーム開始</button></section><section id="game" class="hidden"><section class="card topic-card"><h2>お題</h2><div id="topic" class="topic">---</div><button id="retopic" class="secondary">お題を引き直す</button></section><section class="card"><div id="player" class="player">プレイヤー 1 / 4</div><div class="number-box"><div id="num" class="number">?</div></div><p id="hint" class="hint">自分の数字を確認してください</p><button id="reveal">数字を見る</button><button id="next" class="secondary hidden">数字を隠して次へ</button></section><section id="results" class="card hidden"><h2>答え合わせ</h2><div id="all" class="grid"></div></section><button id="new" class="cream">新しいゲーム</button></section></main><script>const topics=["好きな食べ物","怖いもの","テンションが上がること","嬉しいプレゼント","休日にしたいこと","住んでみたい場所","人生で大切なもの","なくなったら困るもの","友達にされたら嬉しいこと","恋人にされたら嬉しいこと","超能力として欲しい能力","憧れる職業","かわいい動物","高級そうなもの","地味に嬉しいこと","絶対にやりたくないこと","100万円あったら買いたいもの","尊敬できる人","一緒に働きたい人","仲良くなりたい人","信頼できる行動","許せない行動","人生で重要なこと","大人っぽいと思うもの","子どもっぽいと思うもの","やらかしたら恥ずかしいこと","朝起きて最初にしたいこと","コンビニでつい買ってしまうもの","恋人にされたら嫌なこと","デートで嬉しいこと","好きな人に言われたい言葉","恋人に求めるもの","友情に大切なこと","1日だけなれるならなりたいもの","1億円あったらしたいこと","タイムスリップするなら行きたい時代","無人島に持っていきたいもの","1週間休みがあったらしたいこと","生まれ変わったらなりたいもの","苦手な食べ物","毎日食べても飽きないもの","深夜に食べたくなるもの","高級だと思う食べ物","ご褒美として食べたいもの","給食で嬉しかったもの"];let nums=[],p=0,n=4;const $=id=>document.getElementById(id);function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function topic(){$("topic").textContent=topics[Math.floor(Math.random()*topics.length)]}function update(){ $("player").textContent=`プレイヤー ${p+1} / ${n}`;$("num").textContent="?";$("hint").textContent="自分の数字を確認してください";$("reveal").classList.remove("hidden");$("next").classList.add("hidden")}function start(){n=Math.max(2,Math.min(100,+$("count").value||4));nums=shuffle(Array.from({length:100},(_,i)=>i+1)).slice(0,n);p=0;$("setup").classList.add("hidden");$("game").classList.remove("hidden");$("results").classList.add("hidden");topic();update()}$("start").onclick=start;$("retopic").onclick=topic;$("reveal").onclick=()=>{$("num").textContent=nums[p];$("hint").textContent="数字を覚えたら、隠して次のプレイヤーへ";$("reveal").classList.add("hidden");$("next").classList.remove("hidden")};$("next").onclick=()=>{if(p<n-1){p++;update()}else{let s=[...nums].sort((a,b)=>a-b);$("player").textContent="全員の数字";$("num").textContent="✓";$("hint").textContent="数字の小さい順に並べて答え合わせ！";$("next").classList.add("hidden");$("results").classList.remove("hidden");$("all").innerHTML=s.map((x,i)=>`<div class="result"><b>${x}</b>順位 ${i+1}</div>`).join("")}};$("new").onclick=()=>{$("game").classList.add("hidden");$("setup").classList.remove("hidden")}</script></body></html>
