<style>
:root{
  --main:#FFC5AA;
  --pink:#FF9D9D;
  --cream:#EEF8CD;
  --mint:#BBF1D2;
  --text:#4b4542
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  min-height:100vh;
  background:var(--cream);
  color:var(--text);
  font-family:"しろくまフォント","Shirokuma Font","Segoe UI",sans-serif
}

.title,h1,h2,h3,button,.player{
  font-family:"しろくまフォント","Shirokuma Font","Palisade","Segoe UI",sans-serif
}

.wrap{
  width:min(680px,92%);
  margin:auto;
  padding:28px 0 48px
}

h1{
  text-align:center;
  font-size:clamp(2.8rem,10vw,4.5rem);
  margin:0 0 8px
}

.sub{
  text-align:center;
  opacity:.7;
  margin:0 0 24px
}

.card{
  background:#fffdfb;
  border:3px solid var(--main);
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 7px 0 rgba(255,157,157,.35)
}

.topic-card{
  background:var(--main);
  border-color:var(--pink)
}

label{
  display:block;
  font-weight:700;
  margin-bottom:8px
}

input{
  width:100%;
  padding:13px 15px;
  border:2px solid var(--mint);
  border-radius:14px;
  font-size:1.05rem
}

button{
  border:0;
  border-radius:16px;
  padding:13px 18px;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  color:var(--text);
  background:var(--pink);
  box-shadow:0 4px 0 rgba(75,69,66,.12);
  width:100%;
  margin-top:12px
}

button.secondary{
  background:var(--mint)
}

button.cream{
  background:var(--cream)
}

.topic{
  text-align:center;
  font-size:clamp(1.5rem,6vw,2.3rem);
  font-weight:700;
  padding:16px 8px
}

.player{
  text-align:center;
  font-size:1.4rem
}

.number-box{
  background:var(--cream);
  border:3px dashed var(--mint);
  border-radius:20px;
  text-align:center;
  padding:24px 12px;
  margin:16px 0
}

.number{
  font-size:clamp(4rem,18vw,7rem);
  line-height:1;
  font-weight:800
}

.hint{
  text-align:center;
  opacity:.7
}

.hidden{
  display:none
}

.back-button{
  background:none;
  border:none;
  padding:4px 0;
  margin-top:0;
  margin-bottom:12px;
  color:var(--text);
  font-size:14px;
  cursor:pointer;
  text-align:left;
  box-shadow:none;
}

/* 答え合わせカード */

.discussion-title{
  text-align:center;
  font-size:1.5rem;
  font-weight:700;
  margin-bottom:18px
}

.cards-container{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px
}

.result-card{
  height:180px;
  perspective:1000px;
  cursor:pointer
}

.card-inner{
  position:relative;
  width:100%;
  height:100%;
  transition:transform .6s;
  transform-style:preserve-3d
}

.result-card.flipped .card-inner{
  transform:rotateY(180deg)
}

.card-face{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center
}

.card-back{
  background:var(--cream);
  border:3px solid var(--pink)
}

.card-front{
  background:var(--mint);
  border:3px solid var(--pink);

.card-player{

.card-symbol{

.result-number{
  font-size:3rem;
  font-weight:800;
  margin:4px 0

.card-tap{
  font-size:.75rem;
  opacity:.65;
  margin-top:6px

@media(max-width:480px){

  }

  .result-number{

// 名前のチェック
function validateName(name){

  name = name.trim();

  if(!name){
    return {
      valid:false,
      message:"名前を入力してください"
    };
  }

  // 日本語など、英数字以外の文字が含まれているか
  const hasNonAlphanumeric = /[^a-zA-Z0-9]/.test(name);

  const maxLength = hasNonAlphanumeric ? 10 : 12;

  if(name.length > maxLength){

    return {
      valid:false,
      message:
        hasNonAlphanumeric
          ? "日本語を含む名前は10文字以内にしてください"
          : "英数字の名前は12文字以内にしてください"
    };

  }

  return {
    valid:true,
    name:name
  };

}


function shuffle(a){

  for(let i=a.length-1;i;i--){

    let j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;
}

async function joinRoom(){

  // 名前をチェック
  const nameCheck = validateName($("playerName").value);

  if(!nameCheck.valid){

    alert(nameCheck.message);

    $("playerName").focus();

    return;

  }

  const playerName = nameCheck.name;


  roomCode =
    $("roomCode").value.trim().toUpperCase();


  if(!roomCode){

    alert("ルームコードを入力してください");

    return;

  }


  // ルームを検索
  const { data: room, error: roomError } =
    await supabaseClient
      .from("rooms")
      .select("*")
      .eq("room_code", roomCode)
      .single();


  if(roomError || !room){

    console.error("ルーム検索エラー:", roomError);

    alert(
      "そのルームが見つかりませんでした\n\n" +
      "ルームコードを確認してください"
    );

    return;

  }


  // 現在の参加者を取得
  const { data: players, error: playersError } =
    await supabaseClient
      .from("players")
      .select("*")
      .eq("room_code", roomCode);


  if(playersError){

    console.error("参加者取得エラー:", playersError);

    alert(
      "参加者情報を取得できませんでした\n\n" +
      "code: " + playersError.code + "\n" +
      "message: " + playersError.message
    );

    return;

  }


  // 次のプレイヤー番号
  const playerNumber = players.length + 1;


  // 定員オーバーを防ぐ
  if(playerNumber > room.player_count){

    alert("このゲームはすでに満員です");

    return;

  }


  // 自分に割り当てる数字
  const availableNumbers =
    shuffle(
      Array.from(
        {length:100},
        (_,i)=>i+1
      )
    );


  // すでに使われている数字を除外
  const usedNumbers =
    players.map(player => player.number);


  myNumber =
  availableNumbers.find(
    number => !usedNumbers.includes(number)
  );


  // PLAYERとして登録
  const { error: playerError } =
    await supabaseClient
      .from("players")
      .insert({
  room_code: roomCode,
  player_number: playerNumber,
  name: playerName,
  number: myNumber
});


  if(playerError){

    console.error("プレイヤー登録エラー:", playerError);

    alert(
      "プレイヤー登録に失敗しました\n\n" +
      "code: " + playerError.code + "\n" +
      "message: " + playerError.message
    );

    return;

  }


  console.log(
    `PLAYER ${playerNumber} 登録成功`,
    myNumber
  );


  // 自分のゲーム情報
n = room.player_count;
p = room.current_player;
myPlayerNumber = playerNumber;
myPlayerName = playerName;

// 自分の数字を保存
nums = [myNumber];

subscribeToRoom(roomCode);

  $("setup").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("results").classList.add("hidden");


  // お題を表示
  $("topic").textContent = room.topic;


  // プレイヤー表示

}

  if(error || !player){

    console.error("現在のプレイヤー名取得エラー:", error);

    $("player").textContent =
      `プレイヤー ${p + 1} / ${n}`;

    return;

  }


  $("player").textContent =
    `${player.name} / ${n}`;

}


let roomChannel = null;

function subscribeToRoom(roomCode){

  if(roomChannel){
    supabaseClient.removeChannel(roomChannel);
  }

  roomChannel = supabaseClient
    .channel("room-" + roomCode)
    .on(
      "postgres_changes",
      {
        event: "UPDATE",
        schema: "public",
        table: "rooms",
        filter: "room_code=eq." + roomCode
      },
      payload => {

        console.log("ルーム更新:", payload.new);

        const room = payload.new;

        p = room.current_player;

        if(room.phase === "playing"){

  showCurrentPlayerName();

  $("num").textContent = "?";

  $("hint").textContent =
    "自分の数字を確認してください";

  // 自分の番なら数字を見るボタンを表示
  if(myPlayerNumber === p + 1){

    $("reveal").classList.remove("hidden");

  }else{

    $("reveal").classList.add("hidden");

  }

  $("next").classList.add("hidden");

}

if(room.phase === "discussion"){

  $("player").textContent = "話し合い中…";

  $("num").textContent = "💬";

  $("hint").textContent =
    "みんなで数字の順番を予想してみよう！";

  $("reveal").classList.add("hidden");
  $("next").classList.add("hidden");

  $("results").classList.remove("hidden");

  showResults();

}

      }
    )
    .subscribe();

}


$("reveal").onclick = () => {

  // ====================
  // ローカルプレイ
  // ====================

  if(gameMode === "local"){

    const player =
      localPlayers[localCurrentPlayer];

    $("num").textContent =
      player.number;

  }

  // ====================
  // オンラインプレイ
  // ====================

  else{

    $("num").textContent =
      myNumber;

  }

  $("hint").textContent =
    "数字を覚えたら、隠して次のプレイヤーへ";

  $("reveal").classList.add("hidden");

  $("next").classList.remove("hidden");

};

$("next").onclick = async () => {

  // ====================
  // ローカルプレイ
  // ====================

  if(gameMode === "local"){

    if(
      localCurrentPlayer <
      localPlayers.length - 1
    ){

      localCurrentPlayer++;

      showLocalPlayer();

    }else{

      // 全員終了
      $("player").textContent =
        "話し合い中…";

      $("num").textContent =
        "💬";

      $("hint").textContent =
        "みんなで数字の順番を予想してみよう！";

      $("reveal").classList.add("hidden");

      $("next").classList.add("hidden");

      $("results").classList.remove("hidden");

      showLocalResults();

    }

    return;

  }

  // ====================
  // オンラインプレイ
  // ====================

  if(myPlayerNumber !== p + 1){
    return;
  }

  if(p < n - 1){

    const nextPlayer = p + 1;

    const { error } = await supabaseClient
      .from("rooms")
      .update({
        current_player: nextPlayer
      })
      .eq("room_code", roomCode);

    if(error){

      console.error(
        "次のプレイヤーへの更新に失敗:",
        error
      );

      alert(
        "次のプレイヤーへの更新に失敗しました\n\n" +
        error.message
      );

    }

  }else{

    const { error } = await supabaseClient
      .from("rooms")
      .update({
        phase: "discussion"
      })
      .eq("room_code", roomCode);

    if(error){

      console.error(
        "話し合いフェーズへの更新に失敗:",
        error
      );

      alert(
        "ゲーム状態の更新に失敗しました\n\n" +
        error.message
      );

    }

  }

};
